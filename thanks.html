<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | Amai's Candles</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,100,1&family=Nunito:wght@400;700&family=Caveat:wght@600&display=swap">
<style>
:root { --wax: #F5EEE2; --paper: #FBF8F2; --ink: #2B211C; --ink-soft: #6A594C; --line: #DCCDB9; --flame: #F39A2B; --flame-text: #A9560B; }
@media (prefers-color-scheme: dark) {
  :root { --wax: #1C1612; --paper: #261E18; --ink: #F1E6D4; --ink-soft: #BDAA96; --line: #45372C; --flame: #F6A845; --flame-text: #F6B35E; color-scheme: dark; }
}
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--wax); color: var(--ink); font: 400 1.0625rem/1.65 "Nunito", system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
main { max-width: 520px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: clamp(28px, 5vw, 44px); display: grid; gap: 14px; }
h1 { font: 500 1.875rem/1.12 "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 1; margin: 0; }
p { margin: 0; color: var(--ink-soft); }
.note { font: 600 2rem/1.1 "Caveat", cursive; color: var(--flame-text); transform: rotate(-1deg); transform-origin: left center; }
a { justify-self: start; display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--wax); font-weight: 700; text-decoration: none; }
a:hover { background: var(--flame); color: #2B211C; }
</style>
</head>
<body>
<main>
  <h1>Thank you, I've got your order</h1>
  <p>I'll write back soon to talk through the details and the price.</p>
  <p class="note">With love, Amai</p>
  <a href="/">Back to the shop</a>
</main>
</body>
</html>
