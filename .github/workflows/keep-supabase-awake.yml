# Supabase pauses free projects after a week with no visits. This asks it for one
# product every three days so the shop never goes to sleep during a quiet spell.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Supabase for one product
        run: |
          url=$(sed -n "s/^ *url: *'\([^']*\)'.*/\1/p" config.js)
          key=$(sed -n "s/^ *key: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Supabase isn't set up in config.js yet; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error -o /dev/null -H "apikey: $key" "$url/rest/v1/products?select=id&limit=1"
          echo "Supabase answered."
